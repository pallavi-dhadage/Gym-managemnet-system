{% extends "base.html" %}
{% block title %}Admin Dashboard – GymForce{% endblock %}

{% block content %}
<div class="container-fluid py-4">

  <div class="d-flex align-items-center mb-4">
    <i class="fas fa-tachometer-alt fa-lg text-warning me-3"></i>
    <h4 class="fw-bold mb-0">Admin Dashboard</h4>
  </div>

  <!-- KPI Cards -->
  <div class="row g-4 mb-4">
    <div class="col-sm-6 col-lg-3">
      <div class="card stat-card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-warning bg-opacity-10 rounded p-3">
            <i class="fas fa-users fa-lg text-warning"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold">{{ total_leads }}</div>
            <div class="text-muted small">Total Leads</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="card stat-card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-danger bg-opacity-10 rounded p-3">
            <i class="fas fa-bell fa-lg text-danger"></i>
          </div>
          <div>
            <div class="fs-4 fw-bold">{{ new_leads }}</div>
            <div class="text-muted small">New Leads</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Links -->
  <div class="row g-3">
    <div class="col-md-4">
      <a href="{{ url_for('admin.leads') }}" class="card text-decoration-none border-0 shadow-sm hover-shadow">
        <div class="card-body d-flex align-items-center gap-3 p-3">
          <i class="fas fa-address-book fa-lg text-warning"></i>
          <span class="fw-semibold">Manage Leads</span>
          <i class="fas fa-chevron-right ms-auto text-muted"></i>
        </div>
      </a>
    </div>
  </div>

</div>
{% endblock %}
